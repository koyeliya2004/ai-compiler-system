<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Compiler System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #131316;
      --surface2: #1a1a1e;
      --border: #2a2a30;
      --text: #e8e8ec;
      --muted: #7a7a8a;
      --faint: #3a3a45;
      --primary: #7c6af7;
      --primary-hover: #9b8dfb;
      --primary-glow: rgba(124,106,247,0.15);
      --success: #4ade80;
      --error: #f87171;
      --warning: #fb923c;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', sans-serif;
      --radius: 10px;
      --radius-sm: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.95rem; letter-spacing: -0.01em; }
    .logo svg { color: var(--primary); }
    .logo-badge { background: var(--primary-glow); border: 1px solid var(--primary); color: var(--primary); font-size: 0.65rem; font-weight: 600; padding: 2px 7px; border-radius: 999px; letter-spacing: 0.04em; text-transform: uppercase; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .status-label { font-size: 0.75rem; color: var(--muted); }
    main { display: grid; grid-template-columns: 420px 1fr; height: calc(100dvh - 56px); overflow: hidden; }
    .panel-left { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .panel-section { padding: 20px; border-bottom: 1px solid var(--border); }
    .panel-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px; }
    .prompt-area { width: 100%; min-height: 140px; max-height: 220px; resize: vertical; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--sans); font-size: 0.875rem; line-height: 1.6; padding: 14px; outline: none; transition: border-color 0.2s; }
    .prompt-area:focus { border-color: var(--primary); }
    .prompt-area::placeholder { color: var(--faint); }
    .compile-btn { width: 100%; margin-top: 12px; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-family: var(--sans); font-size: 0.875rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s, transform 0.1s; }
    .compile-btn:hover { background: var(--primary-hover); }
    .compile-btn:active { transform: scale(0.98); }
    .compile-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .examples { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .example-chip { display: block; width: 100%; text-align: left; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 0.8rem; color: var(--muted); cursor: pointer; margin-bottom: 8px; transition: all 0.15s; line-height: 1.4; }
    .example-chip:hover { color: var(--text); border-color: var(--primary); background: var(--primary-glow); }
    .panel-right { display: flex; flex-direction: column; overflow: hidden; }
    .tab-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 20px; gap: 0; overflow-x: auto; }
    .tab { padding: 14px 16px 12px; font-size: 0.8rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .output-area { flex: 1; overflow-y: auto; padding: 20px; }
    .metrics-bar { display: flex; gap: 20px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
    .metric { display: flex; flex-direction: column; gap: 2px; }
    .metric-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .metric-value { font-size: 0.875rem; font-weight: 600; font-family: var(--mono); }
    .metric-value.success { color: var(--success); }
    .metric-value.error { color: var(--error); }
    .metric-value.warn { color: var(--warning); }
    .pipeline-stages { display: flex; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--surface); overflow-x: auto; }
    .stage-pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; transition: all 0.3s; }
    .stage-pill.done { border-color: var(--success); color: var(--success); background: rgba(74,222,128,0.08); }
    .stage-pill.active { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); animation: stagePulse 1s infinite; }
    .stage-pill.error { border-color: var(--error); color: var(--error); background: rgba(248,113,113,0.08); }
    @keyframes stagePulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .stage-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .json-container { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow: auto; max-height: 100%; }
    .json-tree { font-family: var(--mono); font-size: 0.78rem; line-height: 1.7; }
    .json-key { color: #7dd3fc; }
    .json-string { color: #86efac; }
    .json-number { color: #fb923c; }
    .json-bool { color: #c084fc; }
    .json-null { color: var(--muted); }
    .json-brace { color: var(--muted); }
    .json-toggle { cursor: pointer; user-select: none; }
    .json-toggle:hover { opacity: 0.7; }
    .json-collapsed { display: none; }
    .copy-btn { position: sticky; top: 0; float: right; padding: 5px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--muted); font-size: 0.72rem; cursor: pointer; transition: all 0.15s; z-index: 1; }
    .copy-btn:hover { color: var(--text); border-color: var(--primary); }
    .validation-list { display: flex; flex-direction: column; gap: 8px; }
    .validation-item { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.8rem; line-height: 1.5; font-family: var(--mono); }
    .validation-item.ok { background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2); color: var(--success); }
    .validation-item.fail { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }
    .validation-item.warn { background: rgba(251,146,60,0.08); border: 1px solid rgba(251,146,60,0.2); color: var(--warning); }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--faint); text-align: center; }
    .empty-state svg { opacity: 0.3; }
    .empty-state p { font-size: 0.85rem; max-width: 260px; line-height: 1.6; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
    .api-config-row { display: flex; gap: 8px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .api-url-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--muted); font-family: var(--mono); font-size: 0.75rem; padding: 6px 10px; outline: none; }
    .api-url-input:focus { border-color: var(--primary); color: var(--text); }
    .api-url-label { font-size: 0.72rem; color: var(--faint); white-space: nowrap; }
    @media (max-width: 768px) { main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .panel-left { height: auto; max-height: 45dvh; } }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
        <line x1="19" y1="12" x2="5" y2="12" style="opacity:0.4"/>
      </svg>
      AI Compiler System
      <span class="logo-badge">v1.0</span>
    </div>
    <div class="header-right">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-label" id="statusLabel">Ready</span>
    </div>
  </header>

  <main>
    <div class="panel-left">
      <div class="panel-section">
        <div class="panel-label">Natural Language Prompt</div>
        <textarea class="prompt-area" id="promptInput"
          placeholder="Describe your app...&#10;&#10;e.g. Build a CRM with login, contacts, dashboard, role-based access, and premium plan with payments."
        ></textarea>
        <button class="compile-btn" id="compileBtn" onclick="runCompile()">
          <div class="spinner" id="spinner"></div>
          <span id="compileBtnText">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline;vertical-align:-2px;margin-right:4px"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Compile App
          </span>
        </button>
      </div>
      <div class="examples">
        <div class="panel-label">Example Prompts</div>
        <button class="example-chip" onclick="useExample(this)">Build a CRM with login, contacts, dashboard, role-based access, and premium plan with payments. Admins can see analytics.</button>
        <button class="example-chip" onclick="useExample(this)">E-commerce platform with product listings, cart, checkout, order tracking, admin dashboard, and Stripe payments.</button>
        <button class="example-chip" onclick="useExample(this)">Project management tool like Jira: sprints, tasks, comments, team roles, kanban board, and reporting.</button>
        <button class="example-chip" onclick="useExample(this)">SaaS analytics dashboard with user auth, event tracking, funnel analysis, and CSV export.</button>
        <button class="example-chip" onclick="useExample(this)">Build a social platform with profiles, posts, likes, comments, follow system, and moderation tools.</button>
      </div>
    </div>

    <div class="panel-right">
      <div class="api-config-row">
        <span class="api-url-label">API URL:</span>
        <input class="api-url-input" id="apiUrl" placeholder="Auto-detected...">
      </div>
      <div class="pipeline-stages" id="pipelineStages">
        <div class="stage-pill" id="s1"><div class="stage-dot"></div>1. Intent</div>
        <div class="stage-pill" id="s2"><div class="stage-dot"></div>2. Design</div>
        <div class="stage-pill" id="s3"><div class="stage-dot"></div>3. Schemas</div>
        <div class="stage-pill" id="s4"><div class="stage-dot"></div>4. Refine</div>
        <div class="stage-pill" id="s5"><div class="stage-dot"></div>5. Validate</div>
        <div class="stage-pill" id="s6"><div class="stage-dot"></div>6. Execute</div>
      </div>
      <div class="metrics-bar" id="metricsBar" style="display:none">
        <div class="metric"><div class="metric-label">Status</div><div class="metric-value" id="mStatus">—</div></div>
        <div class="metric"><div class="metric-label">Latency</div><div class="metric-value" id="mLatency">—</div></div>
        <div class="metric"><div class="metric-label">Pages</div><div class="metric-value" id="mPages">—</div></div>
        <div class="metric"><div class="metric-label">Endpoints</div><div class="metric-value" id="mEndpoints">—</div></div>
        <div class="metric"><div class="metric-label">DB Tables</div><div class="metric-value" id="mTables">—</div></div>
        <div class="metric"><div class="metric-label">Executable</div><div class="metric-value" id="mExec">—</div></div>
        <div class="metric"><div class="metric-label">Repairs</div><div class="metric-value" id="mRepairs">—</div></div>
      </div>
      <div class="tab-bar">
        <button class="tab active" onclick="switchTab('output', this)">Full Output</button>
        <button class="tab" onclick="switchTab('ui', this)">UI Schema</button>
        <button class="tab" onclick="switchTab('api', this)">API Schema</button>
        <button class="tab" onclick="switchTab('db', this)">DB Schema</button>
        <button class="tab" onclick="switchTab('auth', this)">Auth Config</button>
        <button class="tab" onclick="switchTab('validation', this)">Validation</button>
        <button class="tab" onclick="switchTab('runtime', this)">Runtime</button>
      </div>
      <div class="output-area" id="outputArea">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="16 18 22 12 16 6"/>
            <polyline points="8 6 2 12 8 18"/>
          </svg>
          <p>Enter a prompt and click <strong>Compile App</strong> to generate your full app configuration.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    function detectApiUrl() {
      const loc = window.location;
      if (loc.protocol === 'file:') return 'http://localhost:8000';
      return loc.origin;
    }
    document.getElementById('apiUrl').value = detectApiUrl();

    let lastResult = null;
    let currentTab = 'output';
    const STAGES = ['s1','s2','s3','s4','s5','s6'];
    const STAGE_NAMES = ['1. Intent','2. Design','3. Schemas','4. Refine','5. Validate','6. Execute'];

    function useExample(el) { document.getElementById('promptInput').value = el.textContent.trim(); }

    function setStatus(text, color) {
      document.getElementById('statusLabel').textContent = text;
      document.getElementById('statusDot').style.background = color;
      document.getElementById('statusDot').style.boxShadow = `0 0 6px ${color}`;
    }

    function setStage(index, state) {
      const el = document.getElementById(STAGES[index]);
      el.className = `stage-pill ${state}`;
      el.innerHTML = `<div class="stage-dot"></div>${STAGE_NAMES[index]}`;
    }

    function resetStages() { STAGES.forEach((_, i) => setStage(i, '')); }

    async function runCompile() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) { alert('Please enter a prompt.'); return; }

      const apiUrl = document.getElementById('apiUrl').value.trim().replace(/\/$/, '');
      const btn = document.getElementById('compileBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('compileBtnText');

      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.style.display = 'none';
      setStatus('Compiling...', '#fb923c');
      resetStages();
      document.getElementById('metricsBar').style.display = 'none';

      let stageTimer = 0;
      STAGES.forEach((_, i) => {
        setTimeout(() => setStage(i, 'active'), stageTimer);
        stageTimer += 900;
      });

      try {
        const res = await fetch(`${apiUrl}/compile`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        if (!res.ok) { const err = await res.text(); throw new Error(`HTTP ${res.status}: ${err}`); }
        const data = await res.json();
        lastResult = data;
        STAGES.forEach((_, i) => setStage(i, 'done'));
        setStatus(data.success ? 'Success' : 'Compiled with warnings', data.success ? '#4ade80' : '#fb923c');
        updateMetrics(data);
        renderTab(currentTab);
      } catch (err) {
        STAGES.forEach((_, i) => setStage(i, 'error'));
        setStatus('Error', '#f87171');
        document.getElementById('outputArea').innerHTML = `
          <div class="validation-list">
            <div class="validation-item fail">❌ ${escHtml(err.message)}<br><br>
            API URL in use: <strong>${escHtml(apiUrl)}</strong><br>
            If running locally: <code>uvicorn api.app:app --reload</code></div>
          </div>`;
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.style.display = '';
      }
    }

    function updateMetrics(data) {
      // ✅ FIX: read from data.meta and data.runtime (not data.output.metadata)
      const meta    = data.meta    || {};
      const runtime = data.runtime || {};
      const schemas = data.output?.schemas || {};

      document.getElementById('metricsBar').style.display = 'flex';

      const mStatus = document.getElementById('mStatus');
      mStatus.textContent = data.success ? '✅ OK' : '⚠️ Warn';
      mStatus.className = 'metric-value ' + (data.success ? 'success' : 'warn');

      // Latency from meta.total_ms
      const ms = meta.total_ms;
      document.getElementById('mLatency').textContent = ms ? `${ms}ms` : '—';

      document.getElementById('mPages').textContent =
        schemas.ui_config?.pages?.length ?? '—';
      document.getElementById('mEndpoints').textContent =
        schemas.api_config?.endpoints?.length ?? '—';
      document.getElementById('mTables').textContent =
        schemas.db_schema?.tables?.length ?? '—';

      // ✅ FIX: executable lives in data.runtime.is_executable
      const isExec = runtime.is_executable === true;
      const execEl = document.getElementById('mExec');
      execEl.textContent = isExec ? '✅ Yes' : '❌ No';
      execEl.className = 'metric-value ' + (isExec ? 'success' : 'error');

      // Repairs: count from validation
      const repairCount = (data.validation?.errors?.length || 0);
      document.getElementById('mRepairs').textContent = repairCount;
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      if (lastResult) renderTab(tab);
    }

    function renderTab(tab) {
      const area = document.getElementById('outputArea');
      if (!lastResult) return;
      let data;
      switch (tab) {
        case 'output': data = lastResult.output; break;
        case 'ui':     data = lastResult.output?.schemas?.ui_config; break;
        case 'api':    data = lastResult.output?.schemas?.api_config; break;
        case 'db':     data = lastResult.output?.schemas?.db_schema; break;
        case 'auth':   data = lastResult.output?.schemas?.auth_config; break;
        case 'validation': renderValidation(lastResult); return;
        case 'runtime':    renderRuntime(lastResult); return;
      }
      if (!data) { area.innerHTML = '<div class="empty-state"><p>No data for this tab.</p></div>'; return; }
      area.innerHTML = `<button class="copy-btn" onclick="copyJSON()">Copy JSON</button><div class="json-container"><div class="json-tree" id="jsonTree"></div></div>`;
      document.getElementById('jsonTree').innerHTML = renderJSON(data, 0);
    }

    function renderValidation(data) {
      const area = document.getElementById('outputArea');
      const v = data.validation || {};
      const r = data.runtime || {};
      let html = '<div class="validation-list">';
      html += `<div class="validation-item ${v.valid ? 'ok' : 'fail'}">${v.valid ? '✅' : '❌'} Schema Validation: ${v.valid ? 'PASSED' : 'FAILED'}${v.errors?.length ? '<br>' + v.errors.map(e => `&nbsp;&nbsp;└ ${escHtml(e)}`).join('<br>') : ''}</div>`;
      html += `<div class="validation-item ${r.is_executable ? 'ok' : 'fail'}">${r.is_executable ? '✅' : '❌'} Execution Readiness: ${r.is_executable ? 'READY' : 'NOT READY'}${r.issues?.length ? '<br>' + r.issues.map(i => `&nbsp;&nbsp;└ ${escHtml(i)}`).join('<br>') : ''}</div>`;
      if (v.warnings?.length) html += `<div class="validation-item warn">⚠️ Warnings:<br>${v.warnings.map(w => escHtml(w)).join('<br>')}</div>`;
      const meta = data.meta || {};
      if (meta.assumptions?.length) html += `<div class="validation-item warn">📌 Assumptions:<br>${meta.assumptions.map(a => escHtml(a)).join('<br>')}</div>`;
      html += '</div>';
      area.innerHTML = html;
    }

    function renderRuntime(data) {
      const area = document.getElementById('outputArea');
      const r = data.runtime?.preview || {};
      const art = data.artifacts || {};
      let html = '<div class="validation-list">';
      if (r.boot_log?.length) {
        html += `<div class="validation-item ok"><strong>Boot Log:</strong><br>${r.boot_log.map(l => escHtml(l)).join('<br>')}</div>`;
      }
      if (art.openapi_stub) {
        const paths = Object.entries(art.openapi_stub.paths || {});
        if (paths.length) {
          html += `<div class="validation-item ok"><strong>OpenAPI Endpoints (${paths.length}):</strong><br>`;
          paths.forEach(([path, methods]) => {
            Object.keys(methods).forEach(m => { html += `&nbsp;&nbsp;└ ${m.toUpperCase()} ${escHtml(path)}<br>`; });
          });
          html += '</div>';
        }
      }
      if (art.db_migration_preview) {
        html += `<div class="validation-item ok"><strong>SQL Migration Preview:</strong><br><pre style="font-size:0.72rem;margin-top:6px;white-space:pre-wrap">${escHtml(art.db_migration_preview)}</pre></div>`;
      }
      html += '</div>';
      area.innerHTML = html;
    }

    function renderJSON(obj, depth) {
      if (obj === null) return `<span class="json-null">null</span>`;
      if (typeof obj === 'boolean') return `<span class="json-bool">${obj}</span>`;
      if (typeof obj === 'number') return `<span class="json-number">${obj}</span>`;
      if (typeof obj === 'string') return `<span class="json-string">"${escHtml(obj)}"</span>`;
      if (Array.isArray(obj)) {
        if (obj.length === 0) return `<span class="json-brace">[]</span>`;
        const id = 'j' + Math.random().toString(36).slice(2);
        return `<span class="json-toggle json-brace" onclick="toggleNode('${id}')">[${obj.length}]</span><div id="${id}">${obj.map(v => `<div style="margin-left:16px">${renderJSON(v, depth+1)}</div>`).join('')}</div>`;
      }
      if (typeof obj === 'object') {
        const keys = Object.keys(obj);
        if (keys.length === 0) return `<span class="json-brace">{}</span>`;
        const id = 'j' + Math.random().toString(36).slice(2);
        return `<span class="json-toggle json-brace" onclick="toggleNode('${id}')">{${keys.length}}</span><div id="${id}">${keys.map(k => `<div style="margin-left:16px"><span class="json-key">"${escHtml(k)}"</span><span class="json-brace">: </span>${renderJSON(obj[k], depth+1)}</div>`).join('')}</div>`;
      }
      return escHtml(String(obj));
    }

    function toggleNode(id) { const el = document.getElementById(id); if (el) el.classList.toggle('json-collapsed'); }

    function copyJSON() {
      if (!lastResult) return;
      let data;
      switch (currentTab) {
        case 'output': data = lastResult.output; break;
        case 'ui':   data = lastResult.output?.schemas?.ui_config; break;
        case 'api':  data = lastResult.output?.schemas?.api_config; break;
        case 'db':   data = lastResult.output?.schemas?.db_schema; break;
        case 'auth': data = lastResult.output?.schemas?.auth_config; break;
        default:     data = lastResult;
      }
      navigator.clipboard.writeText(JSON.stringify(data, null, 2));
      const btn = document.querySelector('.copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy JSON', 1500);
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runCompile(); });
  </script>
</body>
</html>
